x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/search
  ES_URL: http://elasticsearch:9200
  ES_INDEX: documents

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: search
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d search"]
      interval: 5s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.1
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1"]
      interval: 5s
      retries: 40

  app:
    build: .
    environment: *app-env
    ports:
      - "8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }

  loader:
    build: .
    profiles: ["tools"]
    environment: *app-env
    volumes:
      - ./data:/srv/data:ro
    command: ["python", "-m", "app.load_data", "${DATA_FILE:-data/posts.csv}", "--recreate"]
    depends_on:
      postgres: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }

  tests:
    build:
      context: .
      args: { INSTALL_DEV: "true" }
    profiles: ["tools"]
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/search_test
      TEST_ES_URL: http://elasticsearch:9200
      TEST_ES_INDEX: documents_test
    command: ["pytest", "-v"]
    depends_on:
      postgres: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }

volumes:
  pg_data:
  es_data:
